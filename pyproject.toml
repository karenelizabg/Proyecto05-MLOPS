[project]
name = "mini-tesla-p5"
version = "0.1.0"
description = "Proyecto 5 (ITESO MLOps): detector de obstáculos en CPU, política temporal y control virtual sin motores."
readme = "README.md"
# Una sola versión menor para todo el equipo; uv descarga 3.12 si no está instalada.
requires-python = "==3.12.*"
# Solo lo que ya se usa. Cada ticket agrega lo suyo con `uv add` y sube uv.lock en el
# mismo PR (p. ej. el runtime del detector en P5-05). Nada de paquetes de GPU: el
# entregable se evalúa en CPU (ver tests/test_humo.py).
dependencies = [
    "jsonschema>=4.23,<5",
    "pillow>=11,<13",
    "pyyaml>=6.0,<7",
    # Versiones usadas en la evidencia CPU de P5-04 (Python 3.12).
    "ultralytics==8.3.0",
    "torch==2.9.0",
    # El índice CPU también contiene versiones locales solo para Windows ARM64.
    # Elegir +cpu en Linux x86_64 evita que el lock universal tome una de ellas.
    "torchvision==0.24.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.24.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "opencv-python==4.11.0.86",
    "numpy==1.26.4",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "pytest>=8.3,<9",
]

# En Linux, PyPI ofrece builds de torch con dependencias CUDA. La variante CPU
# oficial evita incluir paquetes NVIDIA en el lock universal. macOS y Windows
# usan las ruedas oficiales de PyPI para estas versiones.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Los paquetes viven en src/ (contrato, control, ...). `uv sync` instala el proyecto en
# modo editable, así que `uv run python -m contrato` funciona sin PYTHONPATH y un paquete
# nuevo dentro de src/ queda disponible sin tocar este archivo.
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores y pyflakes. I: orden de imports. B: bugbear (bugs probables).
# SIM: simplificaciones. C4: comprensiones y literales. RUF: reglas propias de Ruff.
select = ["E", "F", "I", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Respaldo para quien corra pytest sin `uv sync` (p. ej. con un venv propio).
pythonpath = ["src"]
